[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-scan-info"
version = "0.1.5.dev0"
description = "Show metadata, tags, and stream information for audio files (MP3, FLAC)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "audio", "flac", "metadata", "mp3", "music",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "mutagen==1.48.1",
]

[project.scripts]
audio_scan_info = "audio_scan_info:main"

[project.urls]
homepage = "https://github.com/cgoldberg/audio-scan-info"
source = "https://github.com/cgoldberg/audio-scan-info"
download = "https://pypi.org/project/audio-scan-info"

[dependency-groups]
dev = [
    "tox",
]
lint = [
    "ruff",
]
test = [
    "pytest",
]
validate = [
    "validate-pyproject[all]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest]
addopts = ["-v"]
filterwarnings = ["default"]
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 120
respect-gitignore = true
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "BLE001", "C", "COM812", "D", "EM101", "EM102", "FBT",
    "G004", "PLR", "S101", "SIM102", "TRY002", "TRY003", "TRY400"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["INP001"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
